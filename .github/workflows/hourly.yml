name: Research Pipeline

# cron-job.org → workflow_dispatch (매시 KST 정각)
# Notion 수집·분석 → dashboard.snapshot.json 커밋 → Vercel 자동 배포

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: hourly
        type: choice
        options:
          - hourly
          - morning
          - weekly
          - trends
          - export

permissions:
  contents: write

concurrency:
  group: research-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Resolve mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=hourly" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        if: steps.mode.outputs.value != 'export'
        run: |
          case "${{ steps.mode.outputs.value }}" in
            hourly)  npm run hourly ;;
            morning) npm run morning ;;
            weekly)  npm run weekly ;;
            trends)  npm run trends ;;
            *) echo "Unknown mode"; exit 1 ;;
          esac
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: claude-opus-4-6
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          NOTION_MIN_GAP_MS: '900'
          NOTION_MAX_RETRIES: '8'

      - name: Export dashboard snapshot
        if: steps.mode.outputs.value == 'hourly' || steps.mode.outputs.value == 'morning' || steps.mode.outputs.value == 'export'
        run: |
          sleep 45
          npm run export:dashboard
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
          NOTION_MAX_WEEKS: '8'
          NOTION_MIN_GAP_MS: '900'
          NOTION_MAX_RETRIES: '8'

      - name: Push snapshot
        if: steps.mode.outputs.value == 'hourly' || steps.mode.outputs.value == 'morning' || steps.mode.outputs.value == 'export'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dashboard.snapshot.json public/dashboard.version.json public/dedup-index.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: dashboard snapshot"
          fi
          # 실행 중 원격 main 이 앞서면 push 거절됨 → rebase 후 재시도
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push origin HEAD:main && exit 0
            echo "push rejected, retry $attempt/3..."
            sleep 5
          done
          exit 1
