name: Research Pipeline

# 스케줄 (모두 UTC)
# · 매시 정각 — 증분 수집 + 트렌드 스냅샷 (KST 매시 00분)
# · KST 09:00 = UTC 00:00 — 같은 실행에서 주간 인사이트도 갱신
#
# 수동 실행(workflow_dispatch)으로 mode 선택 가능

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: hourly
        type: choice
        options:
          - hourly
          - morning
          - weekly
          - trends

permissions:
  contents: read

concurrency:
  group: research-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Resolve mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=hourly" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        run: |
          case "${{ steps.mode.outputs.value }}" in
            hourly)  npm run hourly ;;
            morning) npm run morning ;;
            weekly)  npm run weekly ;;
            trends)  npm run trends ;;
            *) echo "Unknown mode"; exit 1 ;;
          esac
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: claude-fable-5
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
