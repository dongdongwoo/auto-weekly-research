name: Morning Routine

# npm run morning = 매일 일일 + (월요일 KST) 주간 인사이트·이번 주 페이지까지 한 번에 실행
# --weekly / --daily 는 수동 재실행용. Actions 스케줄은 morning 만 사용.

on:
  schedule:
    # 매일 KST 08:00 = UTC 23:00 (전날)
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # job 이름은 morning 이지만, 월요일 08:00 KST에는 runMorning() 안에서 주간 작업도 이어서 실행됨
  morning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run morning
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: claude-fable-5
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PAGE_ID: ${{ secrets.NOTION_PAGE_ID }}
